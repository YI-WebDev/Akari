<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: 2 段階ログイン（パスワード）</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 48px auto; max-width: 360px; color: #2e2520; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 18px; padding: 10px 20px; font: inherit; border: 0; border-radius: 999px; background: #222; color: #fff; cursor: pointer; }
    pre { margin-top: 24px; padding: 12px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>パスワードを入力</h1>
  <!-- Step 2: the account is shown as text only, there is no username field on this page. -->
  <p id="who"></p>
  <form id="pw-form" action="welcome.html" method="post">
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button id="signin" type="submit">ログイン</button>
  </form>
  <pre id="status" data-state="idle"></pre>
  <script>
    document.getElementById('who').textContent = new URLSearchParams(location.search).get('identifier') || '';
    const form = document.getElementById('pw-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.textContent = JSON.stringify({ password: form.elements.password.value });
      status.dataset.state = 'submitted';
    });
  </script>
</body>
</html>
