<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: ログイン（下にメルマガ登録）</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 48px auto; max-width: 360px; color: #2e2520; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 18px; padding: 10px 20px; font: inherit; border: 0; border-radius: 999px; background: #222; color: #fff; cursor: pointer; }
    pre { margin-top: 24px; padding: 12px; background: #f4f4f4; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>ログイン</h1>
  <form id="page-form" action="welcome.html" method="post">
    <label for="contract">ご契約番号</label>
    <input id="contract" name="txtKeiyakuNo" type="text">
    <label for="pw">暗証番号</label>
    <input id="pw" name="txtPw" type="password">
    <button id="submit" type="submit">ログイン</button>
    <label for="news">お知らせを受け取る</label>
    <input id="news" name="txtNewsletter" type="email">
  </form>
  <pre id="status" data-state="idle"></pre>
  <script>
    document.getElementById('page-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('status').dataset.state = 'submitted';
    });
  </script>
</body>
</html>
