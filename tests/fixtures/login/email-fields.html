<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: チケットの申し込み</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 32px auto; max-width: 360px; color: #2e2520; }
    label { display: block; margin: 64px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px 12px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 16px; padding: 10px 20px; font: inherit; border: 0; border-radius: 999px; background: #222; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>お申し込み</h1>
  <form id="ticket-form" action="welcome.html" method="post">
    <label for="mail">メールアドレス</label>
    <input id="mail" name="customer[mail]" type="email" placeholder="example@ml.example.com">
    <label for="mail2">メールアドレス（確認）</label>
    <input id="mail2" name="mail_confirm" type="text">
    <label for="contact">ご連絡先</label>
    <input id="contact" name="contact" type="text" placeholder="taro@example.com">
    <label for="loginid">ログイン ID</label>
    <input id="loginid" name="login_id" type="text" inputmode="email">
    <label for="friend">お友達のメールアドレス</label>
    <input id="friend" name="friend_email" type="email">
    <label for="find">メールアドレス</label>
    <input id="find" name="search_email" type="email">
    <label for="to">メールアドレス</label>
    <input id="to" name="to" type="email">
    <label for="dest">宛先</label>
    <input id="dest" name="dest_mail" type="email">
    <label for="code">メールに届いた確認コード</label>
    <input id="code" name="mail_code" type="text">
    <label for="server">メールサーバー</label>
    <input id="server" name="mail_server" type="text">
    <label for="member">会員番号またはメールアドレス</label>
    <input id="member" name="member" type="text">
    <label for="sender">メールに表示するお名前</label>
    <input id="sender" name="mail_sender" type="text" autocomplete="name">
    <label for="q">キーワード</label>
    <input id="q" name="q" type="text" placeholder="検索">
    <label for="tel">電話番号</label>
    <input id="tel" name="tel" type="tel">
    <button id="submit" type="submit">次へ</button>
  </form>
</body>
</html>
