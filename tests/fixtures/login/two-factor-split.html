<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: 2 段階認証</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 48px auto; max-width: 360px; color: #2e2520; }
    label, .caption { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    .boxes { display: flex; gap: 8px; }
    .boxes input { width: 44px; text-align: center; }
    button { margin-top: 18px; padding: 10px 20px; font: inherit; border: 0; border-radius: 999px; background: #222; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>2 段階認証</h1>
  <form id="code-form" action="welcome.html" method="post">
    <span class="caption">認証アプリのコード</span>
    <div class="boxes">
      <input id="d1" name="digit1" type="text" inputmode="numeric" maxlength="1" aria-label="認証コード 1 桁目" autocomplete="one-time-code">
      <input id="d2" name="digit2" type="text" inputmode="numeric" maxlength="1" aria-label="認証コード 2 桁目">
      <input id="d3" name="digit3" type="text" inputmode="numeric" maxlength="1" aria-label="認証コード 3 桁目">
      <input id="d4" name="digit4" type="text" inputmode="numeric" maxlength="1" aria-label="認証コード 4 桁目">
      <input id="d5" name="digit5" type="text" inputmode="numeric" maxlength="1" aria-label="認証コード 5 桁目">
      <input id="d6" name="digit6" type="text" inputmode="numeric" maxlength="1" aria-label="認証コード 6 桁目">
    </div>
    <button id="submit" type="submit">確認</button>
  </form>
  <script>
    document.getElementById('code-form').addEventListener('submit', (e) => e.preventDefault());
  </script>
</body>
</html>
