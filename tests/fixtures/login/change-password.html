<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: パスワードの変更</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 48px auto; max-width: 360px; color: #2e2520; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 18px; padding: 10px 20px; font: inherit; border: 0; border-radius: 999px; background: #222; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>パスワードの変更</h1>
  <form id="password-form" action="welcome.html" method="post">
    <label for="current">現在のパスワード</label>
    <input id="current" name="current_password" type="password" autocomplete="current-password">
    <label for="new">新しいパスワード</label>
    <input id="new" name="new_password" type="password" autocomplete="new-password">
    <label for="confirm">新しいパスワード（確認）</label>
    <input id="confirm" name="new_password_confirm" type="password" autocomplete="new-password">
    <button id="submit" type="submit">変更する</button>
  </form>
  <script>
    document.getElementById('password-form').addEventListener('submit', (e) => e.preventDefault());
  </script>
</body>
</html>
