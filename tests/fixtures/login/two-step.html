<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture: 2 段階ログイン（メールアドレス）</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 48px auto; max-width: 360px; color: #2e2520; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 18px; padding: 10px 20px; font: inherit; border: 0; border-radius: 999px; background: #222; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>ログイン</h1>
  <!-- Step 1 of a two-step login: only the username; the password page is a new document. -->
  <form id="user-form" action="two-step-password.html" method="get">
    <label for="identifier">メールアドレス</label>
    <input id="identifier" name="identifier" type="email" autocomplete="username" spellcheck="false">
    <button id="next" type="submit">次へ</button>
  </form>
</body>
</html>
