<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Akari popup preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px; background: #0B0907; font: 13px system-ui, sans-serif; color: #D7CABD; }
  form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  label { display: flex; gap: 4px; align-items: center; }
  select, button { font: inherit; padding: 4px 8px; }
  .frame { width: 680px; height: 480px; border: 1px solid rgba(255, 214, 186, .12); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); background: #14100D; }
  p { margin: 0; color: #8A7B6D; font-size: 12px; }
</style>
</head>
<body>
<div>
  <form id="ctl">
    <label>状態 <select name="state"><option>unlocked</option><option>locked</option><option>setup</option></select></label>
    <label>タブ <select name="tab">
      <option>https://github.com/login</option><option>https://accounts.google.com/</option>
      <option>https://www.amazon.co.jp/</option><option>chrome://newtab/</option>
    </select></label>
    <label>言語 <select name="lang"><option>auto</option><option>ja</option><option>en</option></select></label>
    <label><input type="checkbox" name="empty"> 空の保管庫</label>
    <button type="submit">再読み込み</button>
  </form>
  <p>ロック解除は任意の文字列（"wrong" は誤りとして扱います）。</p>
</div>
<iframe id="frame" class="frame" title="Akari popup"></iframe>
<script type="module">
  // Loads the real popup.html into a srcdoc frame with the chrome mock injected first.
  const ctl = document.getElementById('ctl');
  const frame = document.getElementById('frame');
  const q = new URLSearchParams(location.search);
  for (const el of ctl.elements) {
    if (!el.name || !q.has(el.name)) continue;
    if (el.type === 'checkbox') el.checked = q.get(el.name) === '1';
    else el.value = q.get(el.name);
  }
  async function load() {
    const cfg = {
      state: ctl.state.value, tabUrl: ctl.tab.value, empty: ctl.empty.checked, delay: 1, lang: ctl.lang.value,
    };
    const html = await (await fetch('/extension/src/popup/popup.html', { cache: 'no-store' })).text();
    const inject = '<base href="/extension/src/popup/">'
      + '<script>window.__AKARI_MOCK__=' + JSON.stringify(cfg) + '<\/script>'
      + '<script src="/tests/ui/mock-chrome.js"><\/script>';
    frame.srcdoc = html.replace(/<head>/i, '<head>' + inject);
  }
  ctl.addEventListener('submit', (e) => { e.preventDefault(); load(); });
  load();
</script>
</body>
</html>
