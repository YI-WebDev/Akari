<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Akari</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<div id="app" class="app" data-phase="boot">

  <header class="hdr">
    <button id="vaultBtn" class="vault-btn" type="button" title="保管庫を切り替え" aria-haspopup="menu" aria-expanded="false" aria-controls="vaultMenu">
      <span class="mark" aria-hidden="true">灯</span>
      <span class="vault-cur"><span id="vaultDot" class="vault-dot"></span><span id="vaultLabel" class="vault-label">すべて</span></span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <label id="searchBox" class="search">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="search" class="search-input" type="text" placeholder="検索: サイト・ユーザー名" aria-label="検索 ( / )" autocomplete="off" spellcheck="false">
      <button id="searchClear" class="kbd-btn search-clear" type="button" title="クリア (esc)" aria-label="検索をクリア" hidden>esc</button>
      <span id="searchKey" class="kbd" aria-hidden="true">/</span>
    </label>
    <button id="lockBtn" class="icon-btn" type="button" title="ロック" aria-label="ロック">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
    <button id="plusBtn" class="plus-btn" type="button" title="新規作成" aria-label="新規作成" aria-haspopup="menu" aria-expanded="false" aria-controls="plusMenu">
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main class="body">
    <section class="col-list" aria-label="アイテム一覧">
      <div class="list-bar">
        <div id="filters" class="filters" role="radiogroup" aria-label="フィルター">
          <button type="button" role="radio" data-filter="all" aria-checked="true">すべて<span class="count"></span></button>
          <button type="button" role="radio" data-filter="recent" aria-checked="false">最近<span class="count"></span></button>
          <button type="button" role="radio" data-filter="fav" aria-checked="false" title="お気に入り">★<span class="count"></span></button>
        </div>
        <span class="grow"></span>
        <button id="sortBtn" class="sort-btn" type="button" title="並び替え">新着</button>
      </div>
      <div id="list" class="list" role="listbox" aria-label="アイテム" tabindex="0"></div>
    </section>
    <section id="card" class="pane" aria-live="off">
      <div id="cardScroll" class="pane-scroll"><div id="detail" class="detail"></div></div>
      <div id="editor" class="editor" hidden></div>
    </section>
  </main>

  <footer class="status" aria-label="ステータス">
    <span id="stSave" class="st-save" data-state="saved" title="保管庫は暗号化してこの端末に保存されています"><span class="st-dot" aria-hidden="true"></span><span id="stSaveText">保存済み</span></span>
    <span id="stVault">vault: すべて</span>
    <span id="stCount">0 件</span>
    <span class="grow"></span>
    <span class="st-key"><kbd>/</kbd>検索</span>
    <span class="st-key"><kbd>↑↓</kbd>移動</span>
    <span class="st-key"><kbd>⏎</kbd>コピー</span>
  </footer>

  <div id="catcher" class="catcher"></div>

  <div id="vaultMenu" class="menu menu-vault" role="menu" aria-label="保管庫">
    <div class="menu-head">保管庫を切り替え</div>
    <div id="vaultItems"></div>
    <div class="menu-sep" role="separator"></div>
    <button id="openSettings" class="menu-item" type="button" role="menuitem">
      <svg class="menu-ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="grow">設定</span>
    </button>
  </div>

  <div id="plusMenu" class="menu menu-plus" role="menu" aria-label="新規作成">
    <button id="newLogin" class="menu-item" type="button" role="menuitem" data-key="l" aria-keyshortcuts="L">
      <svg class="menu-ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></svg>
      <span class="grow">新規ログイン</span><span class="menu-key" aria-hidden="true">L</span>
    </button>
    <button id="newNote" class="menu-item" type="button" role="menuitem" data-key="n" aria-keyshortcuts="N">
      <svg class="menu-ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
      <span class="grow">セキュアノート</span><span class="menu-key" aria-hidden="true">N</span>
    </button>
    <div class="menu-sep" role="separator"></div>
    <button id="newGen" class="menu-item" type="button" role="menuitem" data-key="g" aria-keyshortcuts="G">
      <svg class="menu-ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span class="grow">パスワード生成</span><span class="menu-key" aria-hidden="true">G</span>
    </button>
  </div>

  <div id="scrim" class="scrim"></div>

  <section id="genSheet" class="sheet gen" role="dialog" aria-modal="true" aria-labelledby="genTitle" aria-hidden="true">
    <div class="sheet-head">
      <span id="genTitle" class="sheet-title">パスワード生成</span>
      <span id="genChip" class="sheet-sub" hidden></span>
      <span class="grow"></span>
      <button class="kbd-btn" type="button" data-close title="閉じる (esc)" aria-label="閉じる">esc</button>
    </div>
    <div class="gen-cmd" aria-hidden="true"><span class="ps">$ </span><span id="genCmd"></span><span class="cursor"></span></div>
    <div class="gen-out">
      <div id="genChars" class="gen-chars" aria-live="polite"></div>
      <button id="genRegen" class="sq-btn" type="button" title="再生成" aria-label="再生成"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button id="genCopy" class="sq-btn" type="button" title="コピー" aria-label="コピー"></button>
    </div>
    <div id="genMeter" class="meter" data-lv="0">
      <div id="genSegs" class="segs"></div>
      <span id="genBadge" class="lv-label"></span>
    </div>
    <div class="gen-row">
      <div class="mode" role="radiogroup" aria-label="方式">
        <button id="modeRandom" type="button" role="radio" aria-checked="true">ランダム</button>
        <button id="modePhrase" type="button" role="radio" aria-checked="false">パスフレーズ</button>
      </div>
      <span id="sliderLabel" class="slider-label">長さ</span>
      <div id="slider" class="slider" role="slider" tabindex="0" aria-labelledby="sliderLabel" aria-valuemin="8" aria-valuemax="48" aria-valuenow="20">
        <span class="slider-rail"></span><span id="sliderFill" class="slider-fill"></span><span id="sliderKnob" class="slider-knob"></span>
      </div>
      <span id="sliderVal" class="slider-val">20</span>
    </div>
    <div id="genToggles" class="toggles">
      <button type="button" class="tgl" data-opt="upper" role="switch" aria-checked="true"><span class="tgl-mark" aria-hidden="true"></span>大文字</button>
      <button type="button" class="tgl" data-opt="digits" role="switch" aria-checked="true"><span class="tgl-mark" aria-hidden="true"></span>数字</button>
      <button type="button" class="tgl" data-opt="symbols" role="switch" aria-checked="true"><span class="tgl-mark" aria-hidden="true"></span>記号</button>
      <button type="button" class="tgl" data-opt="avoidAmbiguous" role="switch" aria-checked="false"><span class="tgl-mark" aria-hidden="true"></span>紛らわしい文字を除外</button>
    </div>
    <div class="sheet-actions">
      <button id="genCopyText" class="btn-line" type="button">コピー</button>
      <button id="genApply" class="btn-primary" type="button">コピーして閉じる</button>
    </div>
  </section>

  <section id="setSheet" class="sheet settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" aria-hidden="true">
    <div class="sheet-head">
      <span id="setTitle" class="sheet-title">設定</span>
      <span class="sheet-sub">akari config</span>
      <span class="grow"></span>
      <button class="kbd-btn" type="button" data-close title="閉じる (esc)" aria-label="閉じる">esc</button>
    </div>
    <div class="set-scroll">
      <div class="set-row">
        <div class="set-label">自動ロック</div>
        <div class="chips" role="radiogroup" aria-label="自動ロック" data-setting="autoLockMinutes">
          <button type="button" role="radio" data-value="1">1分</button>
          <button type="button" role="radio" data-value="5">5分</button>
          <button type="button" role="radio" data-value="15">15分</button>
          <button type="button" role="radio" data-value="30">30分</button>
          <button type="button" role="radio" data-value="60">60分</button>
          <button type="button" role="radio" data-value="0">ブラウザを閉じたとき</button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">クリップボード消去</div>
        <div class="chips" role="radiogroup" aria-label="クリップボードの消去" data-setting="clipboardClearSeconds">
          <button type="button" role="radio" data-value="10">10秒</button>
          <button type="button" role="radio" data-value="30">30秒</button>
          <button type="button" role="radio" data-value="60">60秒</button>
          <button type="button" role="radio" data-value="0">しない</button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">マスターパスワード</div>
        <div class="set-body">
          <button id="pwToggle" class="set-expander" type="button" aria-expanded="false" aria-controls="pwForm" aria-label="マスターパスワードを変更する">
            <span class="exp-mark" aria-hidden="true"></span>変更する
          </button>
          <form id="pwForm" class="set-form" hidden novalidate>
            <div class="field"><input id="pwCurrent" type="password" placeholder="いまのマスターパスワード" aria-label="いまのマスターパスワード" autocomplete="current-password"></div>
            <div class="field"><input id="pwNext" type="password" placeholder="新しいマスターパスワード（10文字以上）" aria-label="新しいマスターパスワード" autocomplete="new-password"></div>
            <div id="pwMeter" class="meter" data-lv="0"><div id="pwSegs" class="segs"></div><span id="pwLv" class="lv-label">—</span></div>
            <div class="field"><input id="pwConfirm" type="password" placeholder="もう一度" aria-label="新しいマスターパスワード（確認）" autocomplete="new-password"></div>
            <div class="form-foot"><span id="pwErr" class="field-err" role="alert"></span><button id="pwSubmit" class="btn-primary btn-sm" type="submit">変更する</button></div>
          </form>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">バックアップ</div>
        <div class="set-body">
          <div class="set-actions">
            <button id="exportBtn" class="btn-line" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>書き出す
            </button>
            <button id="importToggle" class="btn-line" type="button" aria-expanded="false" aria-controls="importForm">
              <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>読み込む
            </button>
          </div>
          <form id="importForm" class="set-form" hidden novalidate>
            <label class="file-pick">
              <input id="importFile" type="file" accept="application/json,.json">
              <span class="ps" aria-hidden="true">$ </span><span id="importFileName" class="file-name">ファイルを選ぶ…</span>
            </label>
            <div class="field"><input id="importPw" type="password" placeholder="バックアップのマスターパスワード" aria-label="バックアップのマスターパスワード" autocomplete="off"></div>
            <div class="form-foot"><span id="importErr" class="field-err" role="alert"></span><button id="importSubmit" class="btn-primary btn-sm" type="submit">読み込む</button></div>
          </form>
          <p class="set-note">書き出したファイルは暗号化されたままです。読み込むと、いまの保管庫に追加されます。</p>
        </div>
      </div>
      <div id="setVersion" class="set-version"></div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="toast-body">
      <span class="toast-ico" aria-hidden="true">
        <svg class="ico-ok" width="11" height="11" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        <svg class="ico-err" width="11" height="11" viewBox="0 0 24 24"><path d="M12 6v7M12 17.5v.01"/></svg>
      </span>
      <div class="toast-text"><div id="toastMsg" class="toast-msg"></div><div id="toastSub" class="toast-sub"></div></div>
    </div>
    <div id="toastBar" class="toast-bar"></div>
  </div>

  <section id="gate" class="gate" data-mode="lock" aria-hidden="true">
    <span class="gate-scan" aria-hidden="true"></span>
    <span class="gate-glow" aria-hidden="true"></span>
    <div class="gate-inner">
      <div class="brand">
        <span id="gateOrb" class="brand-mark" aria-hidden="true">灯</span>
        <div>
          <h1 class="brand-name">akari<span class="brand-cursor" aria-hidden="true">_</span></h1>
          <div id="gateVersion" class="brand-sub">ゼロ知識・端末内で暗号化される保管庫</div>
        </div>
      </div>

      <form id="lockForm" class="gate-form gate-lock" novalidate>
        <label class="gate-label" for="lockInput"><span class="ps" aria-hidden="true">&gt; </span>マスターパスワードを入力</label>
        <div class="gate-row">
          <div id="lockField" class="gate-field">
            <input id="lockInput" type="password" placeholder="••••••••" autocomplete="current-password" aria-describedby="lockStatus">
          </div>
          <button id="lockSubmit" class="gate-go" type="submit">解除<span aria-hidden="true">⏎</span></button>
        </div>
        <div id="lockStatus" class="gate-status" aria-live="polite"></div>
      </form>

      <form id="setupForm" class="gate-form gate-setup" novalidate>
        <label class="gate-label" for="setupPw"><span class="ps" aria-hidden="true">&gt; </span>マスターパスワードを決める</label>
        <div class="gate-field"><input id="setupPw" type="password" placeholder="10 文字以上" autocomplete="new-password"></div>
        <div class="gate-row">
          <div class="gate-field"><input id="setupPw2" type="password" placeholder="もう一度" aria-label="マスターパスワード（確認）" autocomplete="new-password"></div>
          <button id="setupSubmit" class="gate-go" type="submit" disabled>作成<span aria-hidden="true">⏎</span></button>
        </div>
        <div id="setupMeter" class="meter" data-lv="0"><div id="setupSegs" class="segs"></div><span id="setupLv" class="lv-label">—</span></div>
        <ul class="setup-checks" aria-label="条件">
          <li id="chkLen">10 文字以上</li><li id="chkLv">強度「普通」以上</li><li id="chkMatch">2 回とも同じ</li>
        </ul>
        <p class="setup-warn"><span class="bang" aria-hidden="true">!</span>忘れてしまうと、だれにも復元できません。</p>
        <div id="setupStatus" class="gate-status" aria-live="polite"></div>
      </form>

      <div id="bootLog" class="boot" role="log" aria-label="起動ログ"></div>
    </div>
  </section>

</div>
</body>
</html>
